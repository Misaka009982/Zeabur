name: Build InkOS Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-inkos-package:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ 私有仓库 checkout 方式请保留你原来的写法（token / deploy key 等）
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: Misaka009982/inkos
          token: ${{ secrets.INKOS_REPO_TOKEN }}
          path: inkos-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ⚠️ 依赖安装命令请保留你原来的（npm / pnpm / yarn）
      - name: Install dependencies
        working-directory: inkos-src
        run: npm install --allow-remote=all

      # ⚠️ 构建命令请保留你原来的
      - name: Build
        working-directory: inkos-src
        run: npm run build

      # ⚠️ 打包命令请保留你原来的（npm pack / pnpm pack 等）
      - name: Pack
        working-directory: inkos-src/packages/cli
        run: npm pack

      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: inkos
          path: package-repo

      # 可选：清理旧的版本 tgz，避免仓库无限膨胀
      - name: Clean old packages
        run: |
          rm -f package-repo/packages/misaka009982-inkos-*.tgz

      # ===== 关键修改：复制带版本号的 tgz，并额外复制一份 latest =====
      - name: Copy artifacts
        working-directory: inkos-src
        run: |
          mkdir -p ../package-repo/packages
          cp packages/cli/*.tgz ../package-repo/packages/
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          cp "../package-repo/packages/misaka009982-inkos-${VERSION}.tgz" \
             "../package-repo/packages/misaka009982-inkos-latest.tgz"
          echo "Latest: misaka009982-inkos-latest.tgz -> v${VERSION}"

      # ===== README 同时给出 latest 和特定版本两个链接 =====
      - name: Write package info
        working-directory: inkos-src
        run: |
          INKOS_VERSION=$(node -p "require('./packages/cli/package.json').version")
          INKOS_URL_LATEST="https://github.com/Misaka009982/Zeabur/raw/refs/heads/inkos/packages/misaka009982-inkos-latest.tgz"
          INKOS_URL_VERSIONED="https://github.com/Misaka009982/Zeabur/raw/refs/heads/inkos/packages/misaka009982-inkos-${INKOS_VERSION}.tgz"
          {
            echo "# InkOS Package"
            echo
            echo "Generated from private repo: Misaka009982/inkos"
            echo "Built at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "Packages:"
            ls ../package-repo/packages/misaka009982-inkos*.tgz
            echo
            echo "## 按需安装"
            echo
            echo "默认只安装InkOS CLI。"
            echo
            echo '```powershell'
            echo "# 始终安装最新版（推荐，链接固定不变）"
            echo "npm install -g $INKOS_URL_LATEST"
            echo
            echo "# 或安装当前特定版本 v${INKOS_VERSION}"
            echo "npm install -g $INKOS_URL_VERSIONED"
            echo '```'
          } > ../package-repo/README.md

      - name: Commit package
        working-directory: package-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md packages/misaka009982-inkos*.tgz
          if git diff --cached --quiet; then
            echo "No package changes."
            exit 0
          fi
          git commit -m "build: update InkOS tgz packages"

      - name: Push inkos branch
        working-directory: package-repo
        run: git push origin inkos
