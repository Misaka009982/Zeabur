name: Build InkOS Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-inkos-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package repo
        uses: actions/checkout@v4
        with:
          path: package-repo
          fetch-depth: 0

      - name: Checkout private InkOS repo
        uses: actions/checkout@v4
        with:
          repository: Misaka009982/inkos
          ref: master
          path: inkos-src
          fetch-depth: 1
          ssh-key: ${{ secrets.INKOS_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: inkos-src
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        working-directory: inkos-src
        run: |
          pnpm --filter @misaka009982/inkos-core build
          pnpm --filter @misaka009982/inkos-studio build
          pnpm --filter @misaka009982/inkos build

      - name: Pack InkOS packages
        working-directory: inkos-src
        run: |
          mkdir -p ../packed

          pnpm --filter @misaka009982/inkos-core pack --pack-destination ../packed
          pnpm --filter @misaka009982/inkos-studio pack --pack-destination ../packed
          pnpm --filter @misaka009982/inkos pack --pack-destination ../packed

          ls -lh ../packed

      - name: Prepare inkos branch
        working-directory: package-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin inkos || true

          if git show-ref --verify --quiet refs/remotes/origin/inkos; then
            git checkout inkos
            git pull origin inkos
          else
            git checkout --orphan inkos
            git rm -rf . || true
          fi

      - name: Copy package artifacts
        run: |
          mkdir -p package-repo/packages

          rm -f package-repo/packages/misaka009982-inkos*.tgz

          cp packed/misaka009982-inkos-core-*.tgz package-repo/packages/
          cp packed/misaka009982-inkos-studio-*.tgz package-repo/packages/
          cp packed/misaka009982-inkos-*.tgz package-repo/packages/

          ls -lh package-repo/packages

      - name: Write package info
        working-directory: inkos-src
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          STUDIO_VERSION=$(node -p "require('./packages/studio/package.json').version")
          INKOS_VERSION=$(node -p "require('./packages/cli/package.json').version")

          CORE_URL="https://github.com/Misaka009982/Zeabur/raw/refs/heads/inkos/packages/misaka009982-inkos-core-${CORE_VERSION}.tgz"
          STUDIO_URL="https://github.com/Misaka009982/Zeabur/raw/refs/heads/inkos/packages/misaka009982-inkos-studio-${STUDIO_VERSION}.tgz"
          INKOS_URL="https://github.com/Misaka009982/Zeabur/raw/refs/heads/inkos/packages/misaka009982-inkos-${INKOS_VERSION}.tgz"

          {
            echo "# InkOS Package"
            echo
            echo "Generated from private repo: Misaka009982/inkos"
            echo "Built at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "Packages:"
            ls ../package-repo/packages/misaka009982-inkos*.tgz
            echo
            echo "## 按需安装"
            echo
            echo "默认只安装 InkOS Core 和 InkOS CLI。Studio 已改为需要时再安装。"
            echo
            echo '```powershell'
            echo "npm install -g $CORE_URL $INKOS_URL"
            echo '```'
            echo
            echo "需要 Studio 时单独安装："
            echo
            echo '```powershell'
            echo "npm install -g $STUDIO_URL"
            echo '```'
            echo
            echo "## 全量安装"
            echo
            echo "一次性安装 Core、Studio 和 CLI："
            echo
            echo '```powershell'
            echo "npm install -g $CORE_URL $STUDIO_URL $INKOS_URL"
            echo '```'
          } > ../package-repo/README.md

      - name: Commit package
        working-directory: package-repo
        run: |
          git add README.md packages/misaka009982-inkos*.tgz

          if git diff --cached --quiet; then
            echo "No package changes."
            exit 0
          fi

          git commit -m "build: update InkOS tgz packages"

      - name: Push inkos branch
        working-directory: package-repo
        run: git push origin inkos
