name: Build MiMo2API

on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * *'

concurrency:
  group: mimo2api-build
  cancel-in-progress: true

env:
  REPO: Fly143/MiMo2API
  IMAGE_NAME: mimo2api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 获取最新非 no-tools 的 tag
      - name: Get Latest Valid Tag
        id: tag
        run: |
          TAG=$(git ls-remote --tags --sort='version:refname' https://github.com/${{ env.REPO }}.git \
            | awk -F/ '{print $3}' \
            | grep -v '\^{}' \
            | tac \
            | grep -v 'no-tools' \
            | head -n 1)

          echo "tag=$TAG" >> $GITHUB_OUTPUT

          echo "Selected tag: $TAG"

      # GitHub 用户名转小写
      - name: Lowercase Username
        id: lower
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 检查镜像是否已经存在
      - name: Check Existing Image
        id: check
        run: |
          IMAGE="ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

          echo "Checking image: $IMAGE"

          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists, skip build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image not found, continue build"
          fi

      # 拉取远程仓库指定 tag
      - name: Checkout Remote Repository
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ steps.tag.outputs.tag }}

      # QEMU
      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      # Buildx
      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - name: Login GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送多架构镜像
      - name: Build and Push MultiArch
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
