name: Build MiMo2API

on:
  workflow_dispatch:
  schedule:
    - cron: '50 22 * * *'

concurrency:
  group: mimo2api-build
  cancel-in-progress: true

env:
  REPO: Fly143/MiMo2API
  IMAGE_NAME: mimo2api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # =========================
      # 1. 获取最新 tag（安全版）
      # =========================
      - name: Get Latest Valid Tag
        id: tag
        run: |
          TAG=$(curl -s "https://api.github.com/repos/Fly143/MiMo2API/tags?per_page=100" \
            | jq -r '.[].name' \
            | grep -v 'no-tools' \
            | grep -v 'NO-TOOLS' \
            | head -n 1)

          if [ -z "$TAG" ]; then
            echo "ERROR: no valid tag found"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected tag: $TAG"

      # =========================
      # 2. 小写用户名
      # =========================
      - name: Lowercase Username
        id: lower
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # =========================
      # 3. 检查 GHCR 是否已有该 tag
      # =========================
      - name: Check Existing Image
        id: check
        run: |
          IMAGE="ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image exists, skip build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # 4. checkout main（永远构建 main）
      # =========================
      - name: Checkout main
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: main

      # =========================
      # 5. docker build 环境
      # =========================
      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # =========================
      # 6. 登录 GHCR
      # =========================
      - name: Login GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 7. 自动定位 Dockerfile（关键修复点）
      # =========================
      - name: Find Dockerfile
        id: df
        if: steps.check.outputs.exists != 'true'
        run: |
          FILE=$(find . -name Dockerfile | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Dockerfile: $FILE"

      # =========================
      # 8. Build & Push
      # =========================
      - name: Build and Push MultiArch
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.df.outputs.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
