name: Build MiMo2API

on:
  workflow_dispatch:
  schedule:
    - cron: '50 22 * * *'

concurrency:
  group: mimo2api-build
  cancel-in-progress: true

env:
  REPO: Fly143/MiMo2API
  IMAGE_NAME: mimo2api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # 获取最新 tag
      - name: Get Latest Tag
        id: tag
        run: |
          RAW_TAG=$(curl -s "https://api.github.com/repos/${{ env.REPO }}/releases/latest" \
            | jq -r '.tag_name')

          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "null" ]; then
            echo "Failed to get latest tag"
            exit 1
          fi

          # 去掉 -no-tools
          TAG=$(echo "$RAW_TAG" | sed 's/-no-tools//g')

          echo "tag=$TAG" >> $GITHUB_OUTPUT

          echo "Raw tag: $RAW_TAG"
          echo "Final tag: $TAG"

      # 用户名转小写
      - name: Lowercase Username
        id: lower
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 检查镜像是否已存在
      - name: Check Existing Image
        id: check
        run: |
          IMAGE="ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image not exists"
          fi

      # 拉取 main
      - name: Checkout Main
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: main

      # QEMU
      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      # Buildx
      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - name: Login GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动寻找 Dockerfile
      - name: Find Dockerfile
        id: dockerfile
        if: steps.check.outputs.exists != 'true'
        run: |
          FILE=$(find . -name Dockerfile | head -n 1)

          if [ -z "$FILE" ]; then
            echo "Dockerfile not found"
            exit 1
          fi

          echo "file=$FILE" >> $GITHUB_OUTPUT

          echo "Dockerfile: $FILE"

      # 构建并推送
      - name: Build and Push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
