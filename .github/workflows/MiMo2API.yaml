name: Build MiMo2API

on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * *'

concurrency:
  group: mimo2api-build
  cancel-in-progress: true

env:
  REPO: Fly143/MiMo2API
  IMAGE_NAME: mimo2api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. 获取最新有效 tag（排除 no-tools）
      - name: Get Latest Valid Tag
        id: tag
        run: |
          TAG=$(git ls-remote --tags --sort='version:refname' https://github.com/${{ env.REPO }}.git \
            | awk -F/ '{print $3}' \
            | grep -v '\^{}' \
            | tac \
            | grep -v 'no-tools' \
            | head -n 1)

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected tag: $TAG"

      # 2. 用户名小写
      - name: Lowercase Username
        id: lower
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 3. 检查镜像是否已存在（用 digest 更准确）
      - name: Check Existing Image
        id: check
        run: |
          IMAGE="ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image exists, skip"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 4. checkout（只用来拿 git 工具环境，不拉源码）
      - uses: actions/checkout@v4
        if: steps.check.outputs.exists != 'true'

      # 5. 设置 docker
      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # 6. 登录 GHCR
      - name: Login GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. git archive 拉源码（关键）
      - name: Fetch source via git archive
        if: steps.check.outputs.exists != 'true'
        run: |
          git clone --bare https://github.com/${{ env.REPO }} repo.git
          cd repo.git

          git archive --format=tar ${{ steps.tag.outputs.tag }} | tar -x -C ..

          cd ..
          rm -rf repo.git

          echo "SOURCE=." >> $GITHUB_ENV

      # 8. 构建并推送
      - name: Build and Push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SOURCE }}
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
