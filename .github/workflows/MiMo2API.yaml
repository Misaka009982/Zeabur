name: Build MiMo2API

on:
  workflow_dispatch:
  schedule:
    - cron: '50 22 * * *'

concurrency:
  group: mimo2api-build
  cancel-in-progress: true

env:
  REPO: Fly143/MiMo2API
  IMAGE_NAME: mimo2api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # =========================
      # 1. 获取最新 tag（仅做版本判断）
      # =========================
      - name: Get Latest Tag
        id: tag
        run: |
          TAG=$(git ls-remote --tags --sort='version:refname' https://github.com/${{ env.REPO }}.git \
            | awk -F/ '{print $3}' \
            | grep -v '\^{}' \
            | grep -v 'no-tools' \
            | tail -n 1)

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $TAG"

      # =========================
      # 2. 用户名小写
      # =========================
      - name: Lowercase Username
        id: lower
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # =========================
      # 3. 获取 GHCR 最新版本
      # =========================
      - name: Check remote image version
        id: remote
        run: |
          IMAGE="ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}"

          DIGEST=$(docker manifest inspect $IMAGE:latest 2>/dev/null | sha256sum | awk '{print $1}' || echo "none")

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Remote digest: $DIGEST"

      # =========================
      # 4. 如果版本一致直接跳过
      # =========================
      - name: Decide build
        id: decide
        run: |
          echo "skip=false" >> $GITHUB_OUTPUT

      # =========================
      # 5. clone main（永远构建 main）
      # =========================
      - name: Checkout main branch
        if: steps.decide.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: main

      # =========================
      # 6. setup docker
      # =========================
      - name: Set up QEMU
        if: steps.decide.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.decide.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # =========================
      # 7. login GHCR
      # =========================
      - name: Login GHCR
        if: steps.decide.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 8. 自动检测 Dockerfile（避免路径炸）
      # =========================
      - name: Find Dockerfile
        id: df
        if: steps.decide.outputs.skip != 'true'
        run: |
          FILE=$(find . -name Dockerfile | head -n 1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Found: $FILE"

      # =========================
      # 9. build + push
      # =========================
      - name: Build and Push
        if: steps.decide.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.df.outputs.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
