name: Build MiMo2API

on:
  workflow_dispatch:
  schedule:
    - cron: '50 22 * * *'

concurrency:
  group: mimo2api-build
  cancel-in-progress: true

env:
  REPO: Fly143/MiMo2API
  IMAGE_NAME: mimo2api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # =========================
      # 1. 获取最新 tag（按创建时间）
      # =========================
      - name: Get Latest Valid Tag (by creatordate)
        id: tag
        run: |
          TAG=$(git ls-remote --tags --sort="-creatordate" https://github.com/${{ env.REPO }}.git \
            | awk -F/ '{print $3}' \
            | grep -v '\^{}' \
            | grep -v 'no-tools' \
            | head -n 1)

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected tag: $TAG"

      # =========================
      # 2. 用户名小写
      # =========================
      - name: Lowercase Username
        id: lower
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # =========================
      # 3. 检查 GHCR 是否已存在
      # =========================
      - name: Check Existing Image
        id: check
        run: |
          IMAGE="ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists, skip build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # 4. 拉取 main（永远构建 main）
      # =========================
      - name: Checkout main
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: main

      # =========================
      # 5. QEMU + Buildx
      # =========================
      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # =========================
      # 6. 登录 GHCR
      # =========================
      - name: Login GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 7. 自动定位 Dockerfile
      # =========================
      - name: Find Dockerfile
        id: df
        if: steps.check.outputs.exists != 'true'
        run: |
          FILE=$(find . -name Dockerfile | head -n 1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Dockerfile found: $FILE"

      # =========================
      # 8. Build & Push
      # =========================
      - name: Build and Push MultiArch
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.df.outputs.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
