name: Build AxonHub

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: axonhub-multiarch
  cancel-in-progress: true

env:
  SOURCE_REPO: Misaka009982/axonhub
  IMAGE_NAME: axonhub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${SOURCE_REPO}"
          branch="$(curl -fsSL "$api" | jq -er '.default_branch')"
          commit="$(curl -fsSL "$api/commits/$branch" | jq -er '.sha')"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short_sha=${commit:0:12}" >> "$GITHUB_OUTPUT"

          echo "Source: $SOURCE_REPO"
          echo "Branch: $branch"
          echo "Commit: $commit"

      - name: Normalize image owner
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing image
        id: check
        shell: bash
        env:
          OWNER: ${{ steps.image.outputs.owner }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail

          image="ghcr.io/${OWNER}/${IMAGE_NAME}"
          if docker buildx imagetools inspect "${image}:${COMMIT}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Commit image already exists; skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Dockerfile
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          echo "Dockerfile found."

      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.image.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.source.outputs.commit }}
            ghcr.io/${{ steps.image.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_REPO }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          cache-from: type=gha,scope=axonhub
          cache-to: type=gha,mode=max,scope=axonhub

      - name: Verify multi-arch image
        if: steps.check.outputs.exists != 'true'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "$IMAGE" | tee /tmp/image-manifest.txt

          grep -q 'linux/amd64' /tmp/image-manifest.txt
          grep -q 'linux/arm64' /tmp/image-manifest.txt

          echo "Verified: linux/amd64 and linux/arm64"

      - name: Job summary
        if: always()
        shell: bash
        env:
          OWNER: ${{ steps.image.outputs.owner }}
          COMMIT: ${{ steps.source.outputs.commit }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          EXISTS: ${{ steps.check.outputs.exists }}
        run: |
          {
            echo "## AxonHub Multi-Arch Build"
            echo
            echo "- Source: https://github.com/${SOURCE_REPO}"
            echo "- Commit: \`${COMMIT:-unknown}\`"
            echo "- Result: \`${EXISTS:-unknown}\`"
            echo "- Image: \`ghcr.io/${OWNER}/${IMAGE_NAME}\`"
            echo "- Tags: \`latest\`, \`${COMMIT:-unknown}\`, \`${SHORT_SHA:-unknown}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
