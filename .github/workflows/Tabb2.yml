name: Tabb2

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # 拉取 upstream 仓库（自动使用默认分支）
      - name: Checkout upstream repo
        uses: actions/checkout@v4
        with:
          repository: miaoge2026/tabb2
          path: upstream
          fetch-depth: 1

      # 获取 commit 版本号
      - name: Get upstream short SHA
        run: |
          cd upstream
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${SHORT_SHA}" >> $GITHUB_ENV
          echo "Upstream VERSION=${SHORT_SHA}"

      # 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 检查镜像是否已经存在
      - name: Check if image exists
        run: |
          IMAGE="ghcr.io/${OWNER_LC}/tabb2:${VERSION}"

          echo "Checking ${IMAGE}"

          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
            echo "Image already exists, skip build."
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
            echo "Image not found, will build."
          fi

      # 设置 buildx
      - name: Setup Docker Buildx
        if: env.SKIP_BUILD != 'true'
        uses: docker/setup-buildx-action@v3

      # 构建并推送
      - name: Build and push image
        if: env.SKIP_BUILD != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./upstream
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tabb2:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/tabb2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
