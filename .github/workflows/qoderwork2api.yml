name: Build qoderwork2api

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: qoderwork2api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone upstream
        run: |
          git clone --depth=1 https://github.com/Sliverkiss/qoderwork2api.git source

      - name: Get image info
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(git -C source rev-parse --short HEAD)

          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Prepare config.json
        run: |
          cd source

          if [ ! -f config.json ] && [ -f config.example.json ]; then
            cp config.example.json config.json
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image exists
        id: check
        run: |
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/qoderwork2api:sha-${{ steps.vars.outputs.sha }}"

          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists, skip."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./source
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/qoderwork2api:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/qoderwork2api:sha-${{ steps.vars.outputs.sha }}
