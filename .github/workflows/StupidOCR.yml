name: Build StupidOCR

on:
  workflow_dispatch:

  schedule:
    # 每 6 小时检查一次上游
    - cron: "0 */6 * * *"

concurrency:
  group: stupidocr-build
  cancel-in-progress: true

env:
  REPO: 81NewArk/StupidOCR
  IMAGE_NAME: stupidocr

  # StupidOCR 实际监听端口
  PORT: "6688"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ============================================================
      # 1. 获取上游最新 Commit
      # ============================================================
      - name: Get latest upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          REPO="${{ env.REPO }}"

          echo "========================================"
          echo "Getting upstream information"
          echo "========================================"

          REPO_INFO=$(curl -fsSL \
            "https://api.github.com/repos/${REPO}")

          DEFAULT_BRANCH=$(echo "$REPO_INFO" | jq -r '.default_branch')

          if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" = "null" ]; then
            echo "ERROR: Failed to get default branch"
            exit 1
          fi

          echo "Default branch: ${DEFAULT_BRANCH}"

          COMMIT=$(curl -fsSL \
            "https://api.github.com/repos/${REPO}/commits/${DEFAULT_BRANCH}" \
            | jq -r '.sha')

          if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
            echo "ERROR: Failed to get latest commit"
            exit 1
          fi

          SHORT_COMMIT="${COMMIT:0:7}"

          echo "branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT_COMMIT}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo "Repository : ${REPO}"
          echo "Branch     : ${DEFAULT_BRANCH}"
          echo "Commit     : ${COMMIT}"
          echo "Short      : ${SHORT_COMMIT}"
          echo "========================================"

      # ============================================================
      # 2. 获取小写 GHCR 用户名
      # ============================================================
      - name: Get lowercase owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

          echo "GHCR owner: ${OWNER}"

      # ============================================================
      # 3. 检查这个 Commit 是否已经构建
      # ============================================================
      - name: Check existing image
        id: check
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.short }}"

          echo "========================================"
          echo "Checking existing image"
          echo "========================================"

          echo "Image:"
          echo "$IMAGE"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Image already exists."
            echo "Commit: ${{ steps.upstream.outputs.short }}"
            echo "Skipping build."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Image does not exist."
            echo "Build required."

          fi

      # ============================================================
      # 4. 拉取上游源码
      # ============================================================
      - name: Checkout upstream
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ steps.upstream.outputs.commit }}
          fetch-depth: 1

      # ============================================================
      # 5. 检查项目文件
      # ============================================================
      - name: Check project files
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Checking project files"
          echo "========================================"

          echo ""
          echo "Root directory:"
          ls -lah

          # --------------------------------------------------------
          # requirements.txt
          # --------------------------------------------------------
          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          # --------------------------------------------------------
          # StupidOCR.py
          # --------------------------------------------------------
          if [ ! -f StupidOCR.py ]; then
            echo "ERROR: StupidOCR.py not found"
            exit 1
          fi

          # --------------------------------------------------------
          # dist
          # --------------------------------------------------------
          if [ ! -d dist ]; then
            echo "ERROR: dist directory not found"
            exit 1
          fi

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi

          if [ ! -d dist/assets ]; then
            echo "ERROR: dist/assets directory not found"
            exit 1
          fi

          echo ""
          echo "Required files verified."

          echo ""
          echo "========================================"
          echo "dist contents"
          echo "========================================"

          find dist -maxdepth 2 -type f | sort

      # ============================================================
      # 6. 显示 requirements
      # ============================================================
      - name: Show Python requirements
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          echo "========================================"
          echo "requirements.txt"
          echo "========================================"

          cat requirements.txt

      # ============================================================
      # 7. 生成自己的 Dockerfile
      #
      # 上游仓库没有 Dockerfile
      # 所以直接在 GitHub Actions 中生成
      # ============================================================
      - name: Generate Dockerfile
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generating Dockerfile"
          echo "========================================"

          cat > Dockerfile <<'EOF'
          # ========================================================
          # StupidOCR
          # ========================================================

          FROM python:3.9.16

          # --------------------------------------------------------
          # 工作目录
          # --------------------------------------------------------

          WORKDIR /app

          # --------------------------------------------------------
          # 安装 Python 依赖
          # --------------------------------------------------------

          COPY requirements.txt /app/requirements.txt

          RUN pip install \
              --no-cache-dir \
              --upgrade pip \
              && pip install \
              --no-cache-dir \
              -r /app/requirements.txt

          # --------------------------------------------------------
          # 复制整个项目
          #
          # 这里非常重要：
          #
          # StupidOCR.py 使用：
          #
          #   dist/index.html
          #   dist/assets
          #
          # 所以必须把整个项目复制进镜像。
          # --------------------------------------------------------

          COPY . /app/

          # --------------------------------------------------------
          # 环境变量
          # --------------------------------------------------------

          ENV PYTHONUNBUFFERED=1
          ENV PYTHONDONTWRITEBYTECODE=1

          # --------------------------------------------------------
          # StupidOCR API
          # --------------------------------------------------------

          EXPOSE 6688

          # --------------------------------------------------------
          # 健康检查
          # --------------------------------------------------------

          HEALTHCHECK \
              --interval=30s \
              --timeout=5s \
              --start-period=30s \
              --retries=3 \
              CMD python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6688/docs', timeout=5)" \
              || exit 1

          # --------------------------------------------------------
          # 启动
          # --------------------------------------------------------

          CMD ["python3", "StupidOCR.py"]
          EOF

          echo ""
          echo "========================================"
          echo "Generated Dockerfile"
          echo "========================================"

          cat Dockerfile

          echo ""
          echo "Dockerfile verification:"

          test -f Dockerfile

          echo "OK: Dockerfile exists"

      # ============================================================
      # 8. 设置 QEMU
      # ============================================================
      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      # ============================================================
      # 9. 设置 Buildx
      # ============================================================
      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # 10. 登录 GHCR
      # ============================================================
      - name: Login GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 11. 构建 amd64 + arm64
      # ============================================================
      - name: Build and Push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.short }}
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # 12. 验证最终镜像
      # ============================================================
      - name: Verify image architectures
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.short }}"

          echo "========================================"
          echo "Checking multi-platform image"
          echo "========================================"

          docker buildx imagetools inspect "$IMAGE"

          echo ""
          echo "Checking amd64..."

          docker buildx imagetools inspect "$IMAGE" \
            | grep -q "linux/amd64"

          echo "linux/amd64: OK"

          echo ""
          echo "Checking arm64..."

          docker buildx imagetools inspect "$IMAGE" \
            | grep -q "linux/arm64"

          echo "linux/arm64: OK"

          echo ""
          echo "========================================"
          echo "Multi-platform image verified."
          echo "========================================"

      # ============================================================
      # 13. 构建摘要
      # ============================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "StupidOCR Build Summary"
          echo "========================================"

          echo ""
          echo "Upstream:"
          echo "  Repository : ${{ env.REPO }}"
          echo "  Branch     : ${{ steps.upstream.outputs.branch }}"
          echo "  Commit     : ${{ steps.upstream.outputs.commit }}"
          echo "  Short      : ${{ steps.upstream.outputs.short }}"

          echo ""
          echo "Application:"
          echo "  Port       : 6688"

          echo ""
          echo "Images:"
          echo "  ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.short }}"
          echo "  ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest"

          echo ""
          echo "Platforms:"
          echo "  linux/amd64"
          echo "  linux/arm64"

          echo ""
          echo "========================================"
