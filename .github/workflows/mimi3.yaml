name: Build MiMi3

on:
  workflow_dispatch:
  #schedule:
  #  - cron: '11 23 * * *'

concurrency:
  group: mimi3-build
  cancel-in-progress: true

env:
  REPO: wkeqin/mimi3
  IMAGE_NAME: mimi3
  BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # 获取 main 分支最新 commit
      - name: Get latest commit
        id: commit
        run: |
          COMMIT=$(curl -s \
            https://api.github.com/repos/${{ env.REPO }}/commits/${{ env.BRANCH }} \
            | jq -r '.sha')

          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)

          if [ -z "$COMMIT" ] || [ "$COMMIT" = "null" ]; then
            echo "Failed to get commit hash"
            exit 1
          fi

          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "short=$SHORT_COMMIT" >> $GITHUB_OUTPUT

          echo "Commit: $COMMIT"

      # GitHub 用户名转小写
      - name: Lowercase Username
        id: lower
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 检查镜像是否已存在
      - name: Check Existing Image
        id: check
        run: |
          IMAGE="ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.short }}"

          echo "Checking image: $IMAGE"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image not exists"
          fi

      # 拉取源码（固定 main 分支）
      - name: Checkout Repository
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.BRANCH }}

      # QEMU
      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      # Buildx
      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - name: Login GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动寻找 Dockerfile
      - name: Find Dockerfile
        id: dockerfile
        if: steps.check.outputs.exists != 'true'
        run: |
          FILE=$(find . -name Dockerfile | head -n 1)

          if [ -z "$FILE" ]; then
            echo "Dockerfile not found"
            exit 1
          fi

          echo "file=$FILE" >> $GITHUB_OUTPUT

          echo "Dockerfile: $FILE"

      # 构建并推送
      - name: Build and Push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.short }}
            ghcr.io/${{ steps.lower.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
